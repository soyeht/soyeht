[workspace]
members = ["core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
soyeht-protocol = { path = "../../engine/soyeht-protocol" }
soyeht-platform = { path = "../../engine/soyeht-platform" }
soyeht-client = { path = "../desktop/crates/soyeht-client" }
serde_json = "1.0"
# The bindings of the Kotlin app are generated from the Rust signatures (ADR 0134).
uniffi = { version = "0.29", features = ["cli"] }

[patch.crates-io]
# The scrollback of the terminal screens holds its rows packed (ADR 0144). The fork is
# upstream's 0.16.2 with that one change, on the branch `compact-scrollback`.
vt100 = { git = "https://github.com/soyeht/vt100-rust", rev = "0a1abfbd4dc248fc907aa349e4a5bbea20473122" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"
