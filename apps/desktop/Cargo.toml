[workspace]
members = ["crates/soyeht-client", "crates/soyeht-desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# GPUI is pinned to the commit of the Zed v1.9.0 release tag (ADR 0084). Its `x11` feature is named
# here because `gpui_platform`'s own `x11` feature does not turn it on, and without it GPUI takes a
# session that has only `DISPLAY` for a headless one and opens no window.
gpui = { git = "https://github.com/zed-industries/zed", rev = "ced90fc636c4ede05402befc38a63bae7fd741bd", default-features = false, features = ["x11"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "ced90fc636c4ede05402befc38a63bae7fd741bd", default-features = false, features = ["font-kit", "wayland", "x11"] }
soyeht-protocol = { path = "../../engine/soyeht-protocol" }
soyeht-platform = { path = "../../engine/soyeht-platform" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
vt100 = "0.16.2"
async-channel = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
# Default features off: the parser alone, without its HTML writer or command-line tool.
pulldown-cmark = { version = "0.13", default-features = false }
# Grapheme clusters and the cells a character takes: what a caret moves over and what a line takes.
unicode-segmentation = "1"
unicode-width = "0.2"
# Calendar arithmetic for the engine's ISO 8601 timestamps. GPUI already brings it into the lockfile.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# System notifications: the D-Bus Notify call on Linux (over `zbus`, which GPUI already uses) and a
# toast on Windows. The `z` feature is the pure-Rust D-Bus client; the others pull in a C library.
notify-rust = { version = "4.18", default-features = false, features = ["z"] }

# GPUI depends on forks that Zed applies through its own workspace patches. Cargo ignores
# the patches of a dependency's workspace, so the same revisions are repeated here.
[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "eb6b4fd17b9af5ecc226546bdd04185391b3e265" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev]
debug = 0

[profile.test]
debug = 0

# A shipping build. The engine and the clients rely on unwinding: a poisoned lock is recovered
# (`PoisonError`), a panicked thread is joined and reported, and a panicked task ends only itself,
# so `panic = "abort"` would turn each of those into the death of the whole process. The symbols
# are stripped from the binary: a release is smaller and the engine hashes its whole executable at
# start. `docs/platforms.md` describes the profile.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"
