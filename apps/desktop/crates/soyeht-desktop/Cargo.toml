[package]
name = "soyeht-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "soyeht-desktop"
path = "src/main.rs"

# `dev-tools` builds what the design comparisons need and a release has no use for: the replay of a
# recorded engine state (`fixture`) and the surface gallery (`gallery`). Its examples need it.
[features]
dev-tools = []

[[example]]
name = "design_audit"
required-features = ["dev-tools"]

[[example]]
name = "neo_gallery"
required-features = ["dev-tools"]

[dependencies]
soyeht-client = { path = "../soyeht-client" }
soyeht-webview = { path = "../soyeht-webview" }
soyeht-protocol.workspace = true
soyeht-platform.workspace = true
async-channel.workspace = true
base64.workspace = true
serde_json.workspace = true
gpui.workspace = true
# The picture of a page, in the form the window paints (the same crate GPUI uses).
image.workspace = true
gpui_platform.workspace = true

# Notifications exist on Linux and Windows. Elsewhere `os_notify` reports `Unsupported`.
[target.'cfg(any(target_os = "linux", windows))'.dependencies]
notify-rust.workspace = true

[lints]
workspace = true

# Embeds the Windows icon and version resource (`build.rs`). It is already in the lockfile, as a
# dependency of GPUI, so this adds an edge and no new crate.
[build-dependencies]
embed-resource = "3"
