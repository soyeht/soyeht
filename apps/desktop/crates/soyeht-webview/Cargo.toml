[package]
name = "soyeht-webview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# What a script of the reader answers is read as JSON (`world.rs`).
serde_json.workspace = true

# The web view of the operating system, loaded when the first pane opens: WebKitGTK on Linux. No
# other crate of Soyeht is a dependency: this crate knows pages and pixels, not the protocol.
[target.'cfg(target_os = "linux")'.dependencies]
libloading.workspace = true

# The WebView2 runtime of the system, found when the first pane opens (ADR 0124). `webview2-com`
# holds the generated COM interfaces and statically links Microsoft's loader, which finds the
# runtime installed on the machine: no DLL ships with the program.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
image.workspace = true

[dev-dependencies]
image.workspace = true

[lints]
workspace = true
