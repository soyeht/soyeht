name: Bug report
description: Something in Soyeht does not work.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security problems here; see SECURITY.md.
        Do not paste tokens, pairing codes or private paths.
  - type: input
    id: version
    attributes:
      label: App version
      description: The version of Soyeht you ran. On the Mac and on Windows and Linux it is at the bottom of the Preferences sidebar; it is also the `version` line of the diagnostics report below. On a phone, it is the version the App Store or TestFlight shows. For the command line, run `soyeht --version`.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Operating system, its version and the architecture. For a phone, the model and the iOS or iPadOS version.
      placeholder: macOS 15 arm64, Ubuntu 26.04 arm64, Windows 11 24H2 x64
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste the text that "Copy diagnostics" puts on your clipboard (Mac, Preferences, General; Windows and Linux, Settings, Setup), or the output of `soyeht diagnostics`. It removes paths, names, addresses and tokens. Read it before you paste.
      render: markdown
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest sequence that shows it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
