name: Feature request
description: Propose a change.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Every feature starts in `docs/contracts/`: if it is not in a contract, it is not in
        scope yet. Open an issue before a large change, and say here whether you would build it.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and cannot, or do badly, today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen.
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: Will you build it?
      options:
        - "Yes"
        - "With guidance"
        - "No"
    validations:
      required: true
