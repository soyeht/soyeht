name: protocol
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: protocol-${{ github.ref }}
  cancel-in-progress: true
jobs:
  protocol:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: contracts/typescript/package-lock.json
      - name: Generate and test schema
        run: |
          python3 contracts/generate.py --check
          python3 -m unittest discover -s contracts -p 'test_*.py'
          python3 -m unittest discover -s scripts -p 'test_install_dev.py'
      - name: Rust
        working-directory: engine
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
      - name: Swift on Mac and iOS Simulator
        run: bash scripts/check_swift.sh
      - name: TypeScript
        working-directory: contracts/typescript
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
