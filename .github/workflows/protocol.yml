name: protocol
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: protocol-${{ github.ref }}
  cancel-in-progress: true
jobs:
  protocol:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: contracts/typescript/package-lock.json
      - name: Generate and test schema
        run: |
          python3 contracts/generate.py --check
          python3 -m unittest discover -s contracts -p 'test_*.py'
          python3 -m unittest discover -s scripts -p 'test_install_dev.py'
      - name: Rust
        working-directory: engine
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo build --locked --workspace
          cargo test --locked --workspace
      - name: Slice one acceptances under launchd
        run: python3 scripts/e2e.py --report .cache/e2e.json
      - name: Slice two acceptances under launchd
        run: python3 scripts/e2e_agents.py --report .cache/e2e-agents.json
      - name: Acceptance report
        if: always()
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          for label, filename in [('Slice one', '.cache/e2e.json'), ('Slice two', '.cache/e2e-agents.json')]:
              report = Path(filename)
              if report.exists():
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                      summary.write('## ' + label + ' acceptances\n\n```json\n' + report.read_text() + '\n```\n')
          PYTHON
      - name: Swift on Mac and iOS Simulator
        run: bash scripts/check_swift.sh
      - name: Native client tests
        run: |
          swift format lint --strict --recursive apps/shared/Sources apps/shared/Tests apps/mac/Sources apps/ios/Sources
          swift test --package-path apps/shared
      - name: Mac app
        run: bash scripts/check_mac.sh
      - name: iPhone app
        run: bash scripts/check_ios.sh
      - name: TypeScript
        working-directory: contracts/typescript
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
