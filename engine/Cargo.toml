[workspace]
members = ["soyeht-protocol", "soyeht-ptyd", "soyeht-acp", "soyeht-store", "soyeht-engine", "soyeht-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crc32fast = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.4"
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.dev]
debug = 0

[profile.test]
debug = 0
