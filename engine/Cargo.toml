[workspace]
members = ["soyeht-protocol", "soyeht-ptyd", "soyeht-acp", "soyeht-store", "soyeht-engine", "soyeht-cli", "soyeht-mcp", "soyeht-usage", "soyeht-editor", "soyeht-lsp", "soyeht-vcs", "soyeht-process", "soyeht-web", "soyeht-writing", "soyeht-pane-state", "soyeht-skills", "soyeht-platform"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crc32fast = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.4"
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = "2"
url = "2.5"
core-foundation = "0.9"
security-framework = "2.11"
vt100 = "0.16.2"
crossbeam-channel = "0.5"
bytes = "1"
h2 = "0.4"
http = "1"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
windows-sys = "0.61"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev]
debug = 0

# The engine hashes its whole executable to name its build. Unoptimized, that takes tens of
# seconds on a loaded host and the engine cannot listen until it ends.
[profile.dev.package.sha2]
opt-level = 3

[profile.test]
debug = 0
