[package]
name = "soyeht-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Checks every event and result against the generated models (ADR 0090). The merge gate
# builds and tests with it on; a shipping build leaves it off and checks nothing.
contract-checks = ["soyeht-protocol/contract-checks"]
test-hooks = []

[[bin]]
name = "soyeht-fake-worktrunk"
path = "tests/fake-worktrunk/program.rs"
test = false
bench = false

# The engine program for tests: the same engine with the hooks of `test_hooks` installed
# (ADR 0091). It is built only with the `test-hooks` feature, which no product build enables.
[[bin]]
name = "soyeht-engine-test"
path = "tests/test-engine/program.rs"
required-features = ["test-hooks"]
test = false
bench = false

[dependencies]
soyeht-acp = { path = "../soyeht-acp" }
soyeht-editor = { path = "../soyeht-editor" }
soyeht-lsp = { path = "../soyeht-lsp" }
soyeht-platform = { path = "../soyeht-platform", features = ["tokio"] }
soyeht-pane-state = { path = "../soyeht-pane-state" }
soyeht-process = { path = "../soyeht-process" }
soyeht-protocol = { path = "../soyeht-protocol" }
soyeht-ptyd = { path = "../soyeht-ptyd" }
soyeht-skills = { path = "../soyeht-skills" }
soyeht-store = { path = "../soyeht-store" }
soyeht-usage = { path = "../soyeht-usage" }
soyeht-vcs = { path = "../soyeht-vcs" }
soyeht-web = { path = "../soyeht-web" }
soyeht-writing = { path = "../soyeht-writing" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
base64.workspace = true
chrono.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
getrandom.workspace = true
sha2.workspace = true
hmac.workspace = true
ignore = "0.4"
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
vt100.workspace = true
crossbeam-channel.workspace = true
ed25519-dalek.workspace = true
bytes.workspace = true
h2.workspace = true
http.workspace = true
ring.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
# Enables the hooks for this package's own tests (and so builds `soyeht-engine-test`).
soyeht-engine = { path = ".", features = ["test-hooks"] }
soyeht-platform = { path = "../soyeht-platform", features = ["tokio", "test-support"] }
tokio = { workspace = true, features = ["test-util"] }
soyeht-store = { path = "../soyeht-store", features = ["test-support"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true
security-framework.workspace = true
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[lints]
workspace = true
