[package]
name = "soyeht-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "soyeht"
path = "src/main.rs"

[dependencies]
soyeht-platform = { path = "../soyeht-platform" }
soyeht-protocol = { path = "../soyeht-protocol" }
soyeht-service = { path = "../soyeht-service" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[lints]
workspace = true

[dev-dependencies]
soyeht-platform = { path = "../soyeht-platform", features = ["test-support"] }
soyeht-ptyd = { path = "../soyeht-ptyd" }
soyeht-store = { path = "../soyeht-store", features = ["test-support"] }
